<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rust + WASM</title>
</head>
<body>
    <h1>Rust ejecutando en el navegador vía WASM</h1>
    <p id="output">Cargando...</p>

    <script type="module">
        import init, { add, greet } from './pkg/rust_wasm.js';

        async function run() {
            await init();

            const sum = add(5, 7);
            const message = greet("Fabian");

            document.getElementById('output').innerText =
                `add(5, 7) = ${sum}\n${message}`;
        }

        run();
    </script>
</body>
</html>
